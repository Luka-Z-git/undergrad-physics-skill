name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run structural gate on template-A examples
        run: |
          python tests/validate_structure.py $(find examples -name '*.md' ! -name 'tutoring_diagnosis.md' ! -name 'INDEX.md')
      - name: Run numeric regression
        run: python tests/numeric_regression.py
      - name: Run size budget
        run: python tests/size_budget.py
